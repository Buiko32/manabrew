name: Self-hosted web image

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream release tag to build (defaults to the latest stable release)"
        required: false
        type: string

concurrency:
  group: selfhosted-web-image
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Buiko32/manabrew'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/buiko32/manabrew-web
      IMAGE_CONFIG_VERSION: "1"
      GRAALVM_EA_TAG: jdk-25i3-25.0.4.1-ea.03
      BINARYEN_VERSION: "123"
    steps:
      - name: Resolve upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
          else
            tag="$(gh api repos/witchesofthehill/manabrew/releases/latest --jq .tag_name)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable upstream release tag, got: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out upstream release
        uses: actions/checkout@v4
        with:
          repository: witchesofthehill/manabrew
          ref: ${{ steps.release.outputs.tag }}
          submodules: recursive
          persist-credentials: false

      - name: Record immutable source revision
        id: source
        run: |
          sha="$(git rev-parse HEAD)"
          echo "Upstream checkout resolved to $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive candidate image tag
        id: candidate
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CONFIG_VERSION: ${{ env.IMAGE_CONFIG_VERSION }}
        run: echo "tag=upstream-${RELEASE_TAG}-config${CONFIG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check for an existing candidate
        id: existing
        env:
          IMAGE: ${{ env.IMAGE }}
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$CANDIDATE_TAG" >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache the upstream web image toolchain
        if: steps.existing.outputs.present != 'true'
        id: webimage-toolchain
        uses: actions/cache@v4
        with:
          path: ~/.local/webimage
          key: webimage-${{ env.GRAALVM_EA_TAG }}-binaryen-${{ env.BINARYEN_VERSION }}

      - name: Install the upstream web image toolchain
        if: steps.existing.outputs.present != 'true' && steps.webimage-toolchain.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/webimage" && cd "$HOME/.local/webimage"
          curl -fsSL -o graalvm.tar.gz \
            "https://github.com/graalvm/oracle-graalvm-ea-builds/releases/download/${GRAALVM_EA_TAG}/graalvm-jdk-${GRAALVM_EA_TAG#jdk-}_linux-x64_bin.tar.gz"
          tar xzf graalvm.tar.gz && rm graalvm.tar.gz
          curl -fsSL -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          tar xzf binaryen.tar.gz && rm binaryen.tar.gz

      - name: Set up Node.js
        if: steps.existing.outputs.present != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build the upstream Forge WebAssembly engine
        if: steps.existing.outputs.present != 'true'
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/webimage/binaryen-version_${BINARYEN_VERSION}/bin:$PATH"
          WEBIMAGE_GRAALVM_HOME="$(echo "$HOME"/.local/webimage/graalvm-*)"
          export WEBIMAGE_GRAALVM_HOME
          wasm-as --version
          corepack enable
          yarn install --frozen-lockfile
          scripts/build-forge-wasm.sh
          ls -la packages/forge-wasm/forgeharness*

      - name: Build the self-hosted web candidate
        if: steps.existing.outputs.present != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.candidate.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/Buiko32/manabrew
            org.opencontainers.image.upstream.source=https://github.com/witchesofthehill/manabrew
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
          build-args: |
            VITE_SCRYFALL_SYMBOL_BASE=/scryfall-symbols/
            VITE_SCRYFALL_ASSET_BASE=
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

      - name: Smoke test candidate image
        env:
          IMAGE: ${{ env.IMAGE }}
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          container=""
          smoke_step="start container"
          on_error() {
            status=$?
            echo "Smoke test failed during: $smoke_step" >&2
            if [[ -n "$container" ]]; then
              docker logs --tail 80 "$container" >&2 || true
            fi
            exit "$status"
          }
          trap on_error ERR
          cleanup() {
            if [[ -n "$container" ]]; then
              docker rm -f "$container" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          container="$(docker run -d -p 127.0.0.1::80 "$IMAGE:$CANDIDATE_TAG")"
          smoke_step="resolve mapped port"
          port="$(docker port "$container" 80/tcp | head -1 | sed 's/.*://')"
          base="http://127.0.0.1:$port"
          smoke_step="GET /"
          curl --fail --silent --show-error --connect-timeout 3 --max-time 15 --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 "$base/" -o "$RUNNER_TEMP/index.html"
          smoke_step="check COEP response header"
          grep -qi 'cross-origin-embedder-policy: require-corp' <(curl --fail --silent --show-error --head "$base/")
          smoke_step="find JavaScript bundle"
          bundle="$(grep -oE '/assets/[^" ]+\.js' "$RUNNER_TEMP/index.html" | head -1)"
          test -n "$bundle"
          smoke_step="GET JavaScript bundle"
          curl --fail --silent --show-error "$base$bundle" -o "$RUNNER_TEMP/app.js"
          smoke_step="check asset base paths"
          grep -q '/scryfall-symbols/' "$RUNNER_TEMP/app.js"
          if grep -Eqi 'r2\.dev|__assets/' "$RUNNER_TEMP/app.js"; then
            echo "The candidate bundle still contains an R2 asset mirror path." >&2
            exit 1
          fi
          smoke_step="GET mana symbol W"
          curl --fail --silent --show-error --connect-timeout 3 --max-time 15 --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 "$base/scryfall-symbols/W.svg" -o "$RUNNER_TEMP/mana-W.svg"
          smoke_step="check mana symbol SVG body"
          grep -q '<svg' "$RUNNER_TEMP/mana-W.svg"

      - name: Promote smoke-tested image
        env:
          IMAGE: ${{ env.IMAGE }}
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
        run: docker buildx imagetools create --tag "$IMAGE:selfhosted" "$IMAGE:$CANDIDATE_TAG"
